<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLayers карта с GeoServer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    
    <div class="layer-control">
        <h4>Слои</h4>
        <label>
            <input type="checkbox" id="toggle-buildings" checked> Здания
        </label>
        <label>
            <input type="checkbox" id="toggle-roads" checked> Дороги
        </label>
    </div>
    
    <div class="coords-info">
        Координаты: нажмите на карту
    </div>
    
    <button class="reset-view-btn">Сбросить вид</button>
    
    <script type="import" src="main.js"></script>
</body>
</html>
