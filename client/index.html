<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIS Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      main { height: 100%; display: flex; flex-direction: column; }
      #map { flex: 1; }

      #controls {
        padding: 8px 16px;
        background: #1e1e2e;
        color: #cdd6f4;
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: sans-serif;
        font-size: 14px;
        flex-wrap: wrap;
      }

      #controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      /* Разделитель между группами */
      .sep { width: 1px; height: 20px; background: #45475a; }

      /* Легенда хороплета */
      #legend {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.25);
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="map"></div>
      <div id="controls">
        <span>Слои:</span>
        <label><input type="checkbox" id="chk-overture" checked /> Overture Maps</label>
        <label><input type="checkbox" id="chk-buildings" checked /> Здания (WMS)</label>
        <label><input type="checkbox" id="chk-roads"    checked /> Дороги</label>
        <label><input type="checkbox" id="chk-poi"      checked /> POI</label>

        <div class="sep"></div>

        <div id="legend">
          <span>Источник:</span>
          <div class="legend-item">
            <div class="legend-swatch" style="background:#22c55e"></div>
            <span>my (ЛР1)</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:#3b82f6"></div>
            <span>osm (OpenStreetMap)</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:#f97316"></div>
            <span>ml (Microsoft/Google)</span>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
